{% extends "base.html" %}{% block content %}<section class="section"><h1>Посещаемость</h1><p>{{ lesson }}</p><form method="post" class="attendance-form">{% csrf_token %}{% for b in bookings %}<label class="attendance-row"><span>{{ b.student.user.get_full_name|default:b.student.user.username }}</span><input type="checkbox" name="present_{{ b.id }}"> Присутствовал</label>{% empty %}<p>На занятие пока никто не записан.</p>{% endfor %}<button class="pill">Сохранить ведомость</button></form></section>{% endblock %}
