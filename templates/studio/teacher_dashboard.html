{% extends "base.html" %}{% block content %}<section class="section"><span class="eyebrow">КАБИНЕТ ПРЕПОДАВАТЕЛЯ</span><h1>Мои занятия</h1><div class="lesson-list">{% for l in lessons %}<article class="lesson-row"><div class="lesson-info"><h3>{{ l.group.name }}</h3><p>{{ l.starts_at|date:"d.m.Y H:i" }} · {{ l.group.direction.name }}</p></div><a class="pill" href="{% url 'mark_attendance' l.id %}">Отметить посещаемость →</a></article>{% empty %}<p>Ближайших занятий нет.</p>{% endfor %}</div></section>{% endblock %}
