{% extends "base.html" %}{% block content %}<section class="section"><h1>Управление занятиями</h1><form method="post" class="admin-form">{% csrf_token %}{{ form.as_p }}<button class="pill">Добавить занятие</button></form><div class="lesson-list">{% for l in lessons %}<article class="lesson-row"><div class="lesson-info"><h3>{{ l.group }}</h3><p>{{ l.starts_at|date:"d.m.Y H:i" }} · {{ l.get_status_display }}</p></div><a href="{% url 'edit_lesson' l.id %}">Изменить</a><a href="{% url 'delete_lesson' l.id %}">Удалить</a></article>{% endfor %}</div></section>{% endblock %}
