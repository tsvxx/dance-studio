{% extends "base.html" %}{% block content %}<section class="section"><h1>Управление группами</h1><form method="post" class="admin-form">{% csrf_token %}{{ form.as_p }}<button class="pill">Создать группу</button></form><div class="lesson-list">{% for g in groups %}<article class="lesson-row"><div class="lesson-info"><h3>{{ g.name }}</h3><p>{{ g.direction }} · {{ g.level }} · {{ g.teacher }}</p></div><span>Вместимость: {{ g.capacity }}</span><a href="{% url 'edit_group' g.id %}">Изменить</a><a href="{% url 'delete_group' g.id %}">Удалить</a></article>{% endfor %}</div></section>{% endblock %}
